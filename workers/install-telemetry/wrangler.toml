name = "ga4-install-telemetry"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = true

routes = [
  { pattern = "ga4.builditwithai.xyz", custom_domain = true }
]

[vars]
# POSTHOG_API_KEY is a Wrangler secret: npx wrangler secret put POSTHOG_API_KEY
POSTHOG_HOST = "https://us.i.posthog.com"
GITHUB_REPO = "https://github.com/surendranb/google-analytics-mcp"
DOCS_URL = "https://ga4mcp.com"
