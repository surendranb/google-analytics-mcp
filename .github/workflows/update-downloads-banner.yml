name: Update PyPI Downloads Banner

on:
  schedule:
    - cron: '30 14 * * *' # Run daily at 8:00 PM IST (14:30 UTC)
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write
  id-token: write # Required for Workload Identity Federation

jobs:
  generate-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery playwright
          playwright install chromium --with-deps

      - name: Generate Banner
        run: |
          python scripts/generate_downloads_banner.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/downloads-banner.png
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "chore: update PyPI downloads banner [skip ci]" && git push)
