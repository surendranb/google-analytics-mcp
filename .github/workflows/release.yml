name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  GA4_MCP_INTERNAL: "1"

jobs:
  build-distributions:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check package-facing consistency
        run: python3 scripts/check_package_consistency.py

      - name: Build distributions with uv
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-distributions]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-npm:
    name: Publish NPX wrapper to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          cd npm
          npm publish --access public || echo "NPM publish requires interactive token or trusted publisher setup"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
