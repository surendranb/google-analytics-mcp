name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

env:
  GA4_MCP_INTERNAL: "1"

jobs:
  build-distributions:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check package-facing consistency
        run: python3 scripts/check_package_consistency.py

      - name: Build distributions with uv
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build-distributions]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  publish-to-mcp-registry:
    name: Publish to official MCP registry
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      MCP_PUBLISHER_VERSION: v1.8.16

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      # shortcut: installs from the pinned module tag via sum.golang.org instead of the
      # release tarball + cosign verify-blob flow the registry docs prescribe. The binary
      # reports its version as "dev", which we do not use. Move to the verified tarball if
      # the version string ever needs to be asserted in CI.
      - name: Install mcp-publisher
        run: go install "github.com/modelcontextprotocol/registry/cmd/publisher@${MCP_PUBLISHER_VERSION}"

      # GitHub OIDC proves this repo belongs to the io.github.surendranb namespace, so no
      # long-lived registry token secret is needed and nothing can expire silently.
      - name: Authenticate to the registry
        run: "$(go env GOPATH)/bin/publisher login github-oidc"

      - name: Publish server.json
        run: "$(go env GOPATH)/bin/publisher publish server.json"

  publish-to-npm:
    name: Publish NPX wrapper to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          cd npm
          npm publish --access public || {
            echo "::error::npm publish failed. E401/ENEEDAUTH means secrets.NPM_TOKEN is missing, expired, or lacks publish rights for this package; E403 'cannot publish over the previously published version' means the version is already on npm and the manifests are out of step."
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
